# The whole stack: docker compose up --build --wait
# The `data` network has no way out. Only the web server is published, on this machine only.
# Optional page to browse the database: docker compose --profile tools up -d --wait adminer
# Stop it with: docker compose --profile tools down
name: priority-one

x-python-service: &python-service
  image: priority-one-platform
  build: .
  restart: unless-stopped

x-database: &database
  PGHOST: db
  PGDATABASE: priority

x-clock: &clock
  SCORING_CLOCK: ${SCORING_CLOCK:-}

services:
  db:
    container_name: priority-one-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: priority
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Copy .env.example to .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d priority"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    container_name: priority-one-migrations
    <<: *python-service
    restart: "no"
    command: ["python", "-m", "app.migrate"]
    environment:
      <<: *database
      PGUSER: postgres
      PGPASSWORD: ${DB_OWNER_PASSWORD:?Copy .env.example to .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Copy .env.example to .env}
      SYNC_DB_PASSWORD: ${SYNC_DB_PASSWORD:?Copy .env.example to .env}
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  sources:
    container_name: priority-one-fake-sources
    <<: *python-service
    command: ["uvicorn", "app.fake_sources:app", "--host", "0.0.0.0", "--port", "8001"]
    networks: [data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  sync:
    container_name: priority-one-sync-worker
    <<: *python-service
    command: ["python", "-m", "app.worker"]
    environment:
      <<: [*database, *clock]
      PGUSER: priority_sync
      PGPASSWORD: ${SYNC_DB_PASSWORD:?Copy .env.example to .env}
      SOURCES_URL: http://sources:8001
      SYNC_EVERY_MINUTES: ${SYNC_EVERY_MINUTES:-60}
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      sources:
        condition: service_healthy

  api:
    container_name: priority-one-api
    <<: *python-service
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: [*database, *clock]
      PGUSER: priority_api
      PGPASSWORD: ${API_DB_PASSWORD:?Copy .env.example to .env}
      APP_PASSWORD: ${APP_PASSWORD:?Copy .env.example to .env}
      SESSION_SECRET: ${SESSION_SECRET:?Copy .env.example to .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks: [data, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    container_name: priority-one-web
    image: priority-one-web
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy

  # Not started by default. Open http://localhost:8081/?pgsql=db&username=postgres&db=priority
  adminer:
    container_name: priority-one-adminer
    image: adminer:6.3.0
    profiles: [tools]
    restart: "no"
    ports:
      - "127.0.0.1:8081:8080"
    networks: [data, edge]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

networks:
  data:
    internal: true
  edge:
