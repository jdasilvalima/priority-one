# Serves the page and passes /api to the API service. Nothing else is reachable from outside.
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # A password guess costs a request, so guesses are limited by address.
  location = /api/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
  }

  location /api/ {
    proxy_pass http://api:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
